# GNOME Shell's search-provider registry entry for this app.
#
# Ported from upstream's data/org.gnome.Weather.search-provider.ini.in. That
# file is a meson .in template, substituting @APP_ID@ at build time; this port
# has no meson build, so the id is written in directly, matching
# BackgroundService::APP_ID (lib/background_service.rb) and App::APP_ID
# (lib/main.rb).
#
# Installed at $(datadir)/gnome-shell/search-providers/org.gnome.WeatherRb.search-provider.ini
# so GNOME Shell's overview search finds it; BusName/ObjectPath name the
# background service's own D-Bus activation file
# (org.gnome.WeatherRb.SearchProvider.service, alongside this one), which is
# what actually launches exe/gnome-weather-search-provider.
[Shell Search Provider]
DesktopId=org.gnome.WeatherRb.desktop
BusName=org.gnome.WeatherRb.SearchProvider
ObjectPath=/org/gnome/WeatherRb/SearchProvider
Version=2
DefaultDisabled=true
